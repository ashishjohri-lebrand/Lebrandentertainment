<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: box-shadow 0.3s;
        }

        .search-box input:focus {
            outline: none;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .search-box button {
            padding: 12px 25px;
            background: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            color: #667eea;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .quick-cities {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-city-btn {
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .quick-city-btn:hover {
            background: white;
            color: #667eea;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        .weather-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .city-info h2 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 5px;
        }

        .city-info p {
            color: #999;
            font-size: 0.9rem;
        }

        .close-btn {
            background: #ff6b6b;
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #ff5252;
            transform: scale(1.1);
        }

        .main-weather {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .weather-icon {
            font-size: 4rem;
            color: #667eea;
            width: 100px;
        }

        .temp-info {
            text-align: right;
        }

        .temperature {
            font-size: 2.5rem;
            font-weight: 700;
            color: #333;
            line-height: 1;
        }

        .weather-description {
            color: #666;
            font-size: 1rem;
            text-transform: capitalize;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-item {
            background: #f8f9ff;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .detail-label {
            color: #999;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .detail-value {
            color: #333;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .forecast-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .forecast-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
        }

        .forecast-item {
            background: #f8f9ff;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .forecast-time {
            color: #999;
            font-size: 0.75rem;
            margin-bottom: 5px;
        }

        .forecast-icon {
            font-size: 1.5rem;
            color: #667eea;
            margin: 5px 0;
        }

        .forecast-temp {
            color: #333;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 60px 20px;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .empty-state p {
            font-size: 1.2rem;
        }

        .unit-toggle {
            display: flex;
            gap: 5px;
            margin-top: 15px;
        }

        .unit-toggle button {
            padding: 8px 15px;
            background: #f0f0f0;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            transition: all 0.3s;
        }

        .unit-toggle button.active {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .search-box {
                flex-direction: column;
                max-width: 100%;
            }

            .weather-grid {
                grid-template-columns: 1fr;
            }

            .main-weather {
                flex-direction: column;
                text-align: center;
            }

            .temp-info {
                text-align: center;
                margin-top: 15px;
            }

            .weather-details {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cloud"></i> Weather Dashboard</h1>
            <p>Get real-time weather information for cities worldwide</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="cityInput" 
                    placeholder="Search for a city..." 
                    autocomplete="off"
                >
                <button onclick="searchWeather()"><i class="fas fa-search"></i> Search</button>
            </div>
            <div class="quick-cities">
                <button class="quick-city-btn" onclick="fetchWeatherByCity('London')">London</button>
                <button class="quick-city-btn" onclick="fetchWeatherByCity('New York')">New York</button>
                <button class="quick-city-btn" onclick="fetchWeatherByCity('Tokyo')">Tokyo</button>
                <button class="quick-city-btn" onclick="fetchWeatherByCity('Paris')">Paris</button>
                <button class="quick-city-btn" onclick="fetchWeatherByCity('Sydney')">Sydney</button>
            </div>
        </div>

        <div class="unit-toggle">
            <button class="active" onclick="setUnit('metric')">°C / KM/H</button>
            <button onclick="setUnit('imperial')">°F / MPH</button>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div id="weatherContainer"></div>

        <div class="empty-state" id="emptyState">
            <i class="fas fa-map-marker-alt"></i>
            <p>Search for a city to get started</p>
        </div>
    </div>

    <script>
        const API_KEY = '04e38aaa1a45268c2b66a8ace1cc61a3'; // OpenWeatherMap free API key
        const API_BASE = 'https://api.openweathermap.org/data/2.5';
        let unit = 'metric';
        let citiesWeather = {};

        // Weather icon mapping
        const iconMap = {
            '01d': 'fas fa-sun',
            '01n': 'fas fa-moon',
            '02d': 'fas fa-cloud-sun',
            '02n': 'fas fa-cloud-moon',
            '03d': 'fas fa-cloud',
            '03n': 'fas fa-cloud',
            '04d': 'fas fa-cloud',
            '04n': 'fas fa-cloud',
            '09d': 'fas fa-cloud-rain',
            '09n': 'fas fa-cloud-rain',
            '10d': 'fas fa-cloud-rain-sun',
            '10n': 'fas fa-cloud-moon-rain',
            '11d': 'fas fa-bolt',
            '11n': 'fas fa-bolt',
            '13d': 'fas fa-snowflake',
            '13n': 'fas fa-snowflake',
            '50d': 'fas fa-smog',
            '50n': 'fas fa-smog'
        };

        function setUnit(newUnit) {
            unit = newUnit;
            document.querySelectorAll('.unit-toggle button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderWeather();
        }

        function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (city) {
                fetchWeatherByCity(city);
                document.getElementById('cityInput').value = '';
            }
        }

        function fetchWeatherByCity(city) {
            showLoading();
            clearError();

            fetch(`${API_BASE}/weather?q=${city}&appid=${API_KEY}&units=${unit}`)
                .then(response => {
                    if (!response.ok) {
                        if (response.status === 404) {
                            throw new Error('City not found');
                        }
                        throw new Error('Failed to fetch weather data');
                    }
                    return response.json();
                })
                .then(data => {
                    // Fetch 5-day forecast
                    return fetch(`${API_BASE}/forecast?lat=${data.coord.lat}&lon=${data.coord.lon}&appid=${API_KEY}&units=${unit}`)
                        .then(response => response.json())
                        .then(forecastData => {
                            citiesWeather[data.name] = {
                                current: data,
                                forecast: forecastData.list
                            };
                            renderWeather();
                        });
                })
                .catch(error => {
                    showError(error.message);
                    hideLoading();
                });
        }

        function renderWeather() {
            const container = document.getElementById('weatherContainer');
            const emptyState = document.getElementById('emptyState');

            if (Object.keys(citiesWeather).length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            container.innerHTML = '';

            Object.entries(citiesWeather).forEach(([cityName, data]) => {
                const current = data.current;
                const forecast = data.forecast;

                const tempUnit = unit === 'metric' ? '°C' : '°F';
                const speedUnit = unit === 'metric' ? 'km/h' : 'mph';
                const icon = iconMap[current.weather[0].icon] || 'fas fa-cloud';

                // Get next 8 forecast items (24 hours)
                const forecastHTML = forecast.slice(0, 8).map(item => {
                    const date = new Date(item.dt * 1000);
                    const time = date.getHours() + ':' + String(date.getMinutes()).padStart(2, '0');
                    const forecastIcon = iconMap[item.weather[0].icon] || 'fas fa-cloud';
                    return `
                        <div class="forecast-item">
                            <div class="forecast-time">${time}</div>
                            <div class="forecast-icon"><i class="${forecastIcon}"></i></div>
                            <div class="forecast-temp">${Math.round(item.main.temp)}${tempUnit}</div>
                        </div>
                    `;
                }).join('');

                const card = document.createElement('div');
                card.className = 'weather-card';
                card.innerHTML = `
                    <div class="weather-header">
                        <div class="city-info">
                            <h2>${current.name}, ${current.sys.country}</h2>
                            <p>${new Date().toLocaleDateString()}</p>
                        </div>
                        <button class="close-btn" onclick="removeCity('${cityName}')">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>

                    <div class="main-weather">
                        <div class="weather-icon">
                            <i class="${icon}"></i>
                        </div>
                        <div class="temp-info">
                            <div class="temperature">${Math.round(current.main.temp)}${tempUnit}</div>
                            <div class="weather-description">${current.weather[0].description}</div>
                        </div>
                    </div>

                    <div class="weather-details">
                        <div class="detail-item">
                            <div class="detail-label">Feels Like</div>
                            <div class="detail-value">${Math.round(current.main.feels_like)}${tempUnit}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Humidity</div>
                            <div class="detail-value">${current.main.humidity}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Pressure</div>
                            <div class="detail-value">${current.main.pressure} mb</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Wind Speed</div>
                            <div class="detail-value">${Math.round(current.wind.speed)} ${speedUnit}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Visibility</div>
                            <div class="detail-value">${(current.visibility / 1000).toFixed(1)} km</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">UV Index</div>
                            <div class="detail-value">${current.clouds.all}%</div>
                        </div>
                    </div>

                    <div class="forecast-section">
                        <div class="forecast-title">24-Hour Forecast</div>
                        <div class="forecast-grid">
                            ${forecastHTML}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function removeCity(cityName) {
            delete citiesWeather[cityName];
            renderWeather();
        }

        function showLoading() {
            const container = document.getElementById('weatherContainer');
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading weather data...</p>
                </div>
            `;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function clearError() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        function hideLoading() {
            // Loading will be replaced by renderWeather or error
        }

        // Allow Enter key to search
        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchWeather();
            }
        });

        // Load initial weather for a default city
        window.addEventListener('load', () => {
            fetchWeatherByCity('London');
        });
    </script>
</body>
</html>
